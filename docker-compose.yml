version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: smartdoc-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass rag123456
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: smartdoc-rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: rag
      RABBITMQ_DEFAULT_PASS: rag123456
      RABBITMQ_DEFAULT_VHOST: /rag
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartdoc-worker
    command: python -m app.worker
    depends_on:
      - redis
      - rabbitmq
    env_file:
      - .env
    environment:
      ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: rag123456
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: rag
      RABBITMQ_PASSWORD: rag123456
      RABBITMQ_VHOST: /rag
    volumes:
      - ./app/data/storage:/app/app/data/storage
      - ./app/data/chat_history:/app/app/data/chat_history
      - ./app/data/report:/app/app/data/report
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartdoc-api
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
    depends_on:
      - redis
      - rabbitmq
      - worker
    env_file:
      - .env
    environment:
      ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: rag123456
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: rag
      RABBITMQ_PASSWORD: rag123456
      RABBITMQ_VHOST: /rag
    volumes:
      - ./app/data/storage:/app/app/data/storage
      - ./app/data/chat_history:/app/app/data/chat_history
      - ./app/data/report:/app/app/data/report
      - ./app/app.db:/app/app/app.db
    restart: unless-stopped

volumes:
  redis_data:
  rabbitmq_data:
