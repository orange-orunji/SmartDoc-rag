<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业知识库</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>
<body>

<!-- 登录 / 注册 -->
<div id="auth-page" class="auth-layout">
    <aside class="auth-brand">
        <div class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
        </div>
        <h1>企业知识库</h1>
        <p class="auth-brand-desc">基于 RAG 的智能文档问答系统，<br>让团队知识触手可及。</p>
        <ul class="auth-brand-points">
            <li>文档检索与智能问答</li>
            <li>多轮对话上下文理解</li>
            <li>报告生成与附件下载</li>
        </ul>
    </aside>
    <main class="auth-panel">
        <div class="auth-form-wrap">
            <h2 id="auth-form-title">登录</h2>
            <p class="auth-form-sub">使用您的账号继续访问知识库</p>
            <div class="auth-tabs" role="tablist">
                <button type="button" id="tab-login" class="active" onclick="switchAuthTab('login')">登录</button>
                <button type="button" id="tab-register" onclick="switchAuthTab('register')">注册</button>
            </div>
            <form id="auth-form" onsubmit="handleAuth(event)" novalidate>
                <div class="form-group">
                    <label for="auth-username">用户名</label>
                    <input type="text" id="auth-username" placeholder="请输入用户名" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="auth-password">密码</label>
                    <input type="password" id="auth-password" placeholder="请输入密码" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="auth-submit-btn">登录</button>
                <div class="auth-msg" id="auth-msg"></div>
            </form>
        </div>
    </main>
</div>

<!-- 主界面 -->
<div id="chat-page" class="app-layout hidden">
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="brand-mini">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                </svg>
                <span>企业知识库</span>
            </div>
            <button class="btn-logout" onclick="logout()" title="退出登录">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                <span>退出</span>
            </button>
        </div>

        <div class="sidebar-user">
            <div class="avatar" id="avatar-initial">?</div>
            <div class="sidebar-user-info">
                <span class="sidebar-username" id="display-username"></span>
                <span class="sidebar-user-role">普通用户</span>
            </div>
        </div>

        <div class="sidebar-section">
            <button class="btn-new-session" onclick="createSession()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                新建会话
            </button>
        </div>

        <div class="sidebar-section-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
            我的会话
        </div>
        <div class="session-list" id="session-list">
            <div class="session-list-hint">加载中...</div>
        </div>

        <div class="upload-area">
            <div class="sidebar-section-label">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                上传文档
            </div>
            <input type="file" id="file-input" accept=".txt,.docx,.pdf,.md" onchange="handleFileUpload(event)">
            <label for="file-input" class="btn-upload">选择文件上传</label>
            <div class="upload-status" id="upload-status"></div>
        </div>
    </aside>

    <main class="chat-area">
        <header class="chat-header">
            <div class="chat-header-title">
                <span class="session-title" id="chat-header-session">新会话</span>
            </div>
            <span class="chat-header-badge">RAG 增强检索</span>
        </header>
        <div class="chat-messages" id="chat-messages">
            <div class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                <p>选择或新建一个会话开始对话</p>
            </div>
        </div>
        <div class="chat-input-area">
            <div class="chat-input-row">
                <textarea id="chat-input" placeholder="输入问题，Enter 发送，Shift+Enter 换行" rows="1" onkeydown="handleInputKey(event)"></textarea>
                <button class="btn-send" onclick="sendMessage()" id="send-btn" title="发送">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"/>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                </button>
            </div>
        </div>
    </main>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
